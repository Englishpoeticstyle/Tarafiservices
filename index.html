    .contact-bar a:hover { background: var(--red); color: var(--white); border-color: var(--red); }

    .contact-list div { padding: 12px 14px; border-radius: 12px; background: var(--paper); }

    .repair-items span { padding: 7px 11px; border: 1px solid #c8dfd0; border-radius: 999px; background: var(--white); font-size: .88rem; }

    .filter[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: var(--white); }

    .section-title { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin: 28px 0 14px; }
    .count { color: var(--muted); font-size: .9rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 14px; }
    .card { display: flex; flex-direction: column; min-height: 190px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); box-shadow: 0 4px 14px rgb(23 35 31 / 3%); }

        intro: "دليل لخدمات مفيدة في الجزائر، مع معلومات عن إصلاح الحواسيب والحواسيب المحمولة. تحقق من الروابط وتفاصيل الخدمات قبل استخدامها.",
        contactTitle: "اتصل بنا", repairTitle: "إصلاح الحواسيب والحواسيب المحمولة",
        repairText: "هل تحتاج إلى مساعدة في حاسوبك أو حاسوبك المحمول؟ تواصل مع بوزاهر نور الدين للإصلاح والدعم التقني.",
        repairItems: ["إصلاح الحواسيب", "إصلاح الحواسيب المحمولة", "التشخيص وحل الأعطال", "دعم البرمجيات والنظام", "دعم العتاد"],
        search: "ابحث عن خدمة…", directoryTitle: "دليل الخدمات",
        notice: "يتم فحص كل رابط خارجي من ناحية الأمان قبل فتحه. الروابط المعلّمة «بانتظار فحص الأمان» مقفلة حتى يتم التحقق منها. بعض الصفات الرسمية غير مؤكدة؛ هذا الدليل إخباري وغير تابع للخدمات المدرجة.",
        noMatch: "لا توجد خدمات تطابق بحثك.",
        footer: "بوزاهر نور الدين - خدمات كومبتوتريست · الجزائر",
        credit: "تصميم الموقع: السيد محمد طرفي",
        all: "الكل",
        visit: "زيارة الموقع ↗", pending: "بانتظار فحص الأمان", approved: "تم التحقق: آمن",
        notConfirmed: "الرابط الرسمي غير مؤكد", thirdParty: "طرف ثالث",
        cats: { edu: "التعليم", univ: "الجامعة", transport: "النقل", training: "التكوين", legal: "قانوني / وثائق", general: "عام", payment: "الدفع / الضرائب", telecom: "الاتصالات", services: "خدمات", employment: "التشغيل" },
        contactLabels: { phone: "الهاتف", whatsapp: "واتساب", email: "البريد الإلكتروني", address: "العنوان", hours: "ساعات العمل" },
        call: "اتصال", count1: "خدمة", countN: "خدمات"
      }
    };

    let lang = localStorage ? (localStorage.getItem("lang") || "en") : "en";
    let activeCat = "all";

    const $ = sel => document.querySelector(sel);
    const t = () => I18N[lang];

    function applyLang() {
      const html = document.documentElement;
      html.lang = lang;
      html.dir = lang === "ar" ? "rtl" : "ltr";

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (typeof t()[key] === "string") el.textContent = t()[key];
      });
      document.querySelectorAll("#lang button").forEach(b => {
        b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
      });
      $("#search").placeholder = t().search;
      $("#search").setAttribute("aria-label", t().search);

      const rep = $("#repair-items");
      rep.replaceChildren(...t().repairItems.map(txt => {
        const s = document.createElement("span");
        s.textContent = txt;
        return s;
      }));

      renderContact();
      renderFilters();
      renderServices();
    }

    function renderContact() {
      const bar = $("#contact-bar");
      const list = $("#contact-list");
      bar.replaceChildren();
      list.replaceChildren();

      const addLink = (text, href, secondary) => {
        const a = document.createElement("a");
        a.textContent = text;
        a.href = href;
        if (secondary) a.className = "secondary";
        bar.append(a);
      };
      if (contact.phone) addLink(t().call, `tel:${contact.phone.replace(/\s+/g, "")}`);
      if (contact.whatsapp) addLink("WhatsApp", `https://wa.me/${contact.whatsapp}`, true);
      if (contact.email) addLink("Email", `mailto:${contact.email}`, true);

      const L = t().contactLabels;
      [
        [L.phone, contact.phone],
        [L.whatsapp, contact.whatsapp ? "+" + contact.whatsapp : ""],
        [L.email, contact.email],
        [L.address, contact.address],
        [L.hours, contact.hours]
      ].filter(([, v]) => v).forEach(([label, value]) => {
        const wrap = document.createElement("div");
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value;
        wrap.append(dt, dd);
        list.append(wrap);
      });
      $("#contact-card").hidden = list.children.length === 0;
    }

    function renderFilters() {
      const filters = $("#filters");
      filters.replaceChildren();
      const keys = ["all", ...new Set(services.map(s => s.cat))];
      keys.forEach(key => {
        const b = document.createElement("button");
        b.className = "filter";
        b.textContent = key === "all" ? t().all : t().cats[key];
        b.setAttribute("aria-pressed", String(key === activeCat));
        b.addEventListener("click", () => {
          activeCat = key;
          renderFilters();
          renderServices();
        });
        filters.append(b);
      });
    }

    function renderServices() {
      const term = $("#search").value.trim().toLowerCase();
      const list = $("#services");
      const shown = services.filter(s => {
        const matchCat = activeCat === "all" || s.cat === activeCat;
        const hay = `${s.name} ${t().cats[s.cat]} ${s.desc[lang]}`.toLowerCase();
        return matchCat && hay.includes(term);
      });

      list.replaceChildren();
      shown.forEach(s => {
        const card = document.createElement("article");
        card.className = "card";

        const top = document.createElement("div");
        top.className = "card-top";
        const heading = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = s.name;
        const cat = document.createElement("p");
        cat.className = "category";
        cat.textContent = t().cats[s.cat] + (s.third ? " · " + t().thirdParty : "");
        heading.append(title, cat);

        const badge = document.createElement("span");
        badge.className = "badge";
        if (s.url) {
          badge.classList.add(s.approved ? "approved" : "pending");
          badge.textContent = s.approved ? t().approved : t().pending;
        } else {
          badge.textContent = t().notConfirmed;
        }
        top.append(heading, badge);

        const desc = document.createElement("p");
        desc.className = "description";
        desc.textContent = s.desc[lang];
        card.append(top, desc);

        if (s.url && s.approved) {
          const a = document.createElement("a");
          a.className = "visit";
          a.href = s.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = t().visit;
          card.append(a);
        } else {
          const note = document.createElement("span");
          note.className = "unavailable";
          note.textContent = s.url ? t().pending : t().notConfirmed;
          card.append(note);
        }
        list.append(card);
      });

      $("#count").textContent = `${shown.length} ${shown.length === 1 ? t().count1 : t().countN}`;
      $("#empty").hidden = shown.length !== 0;
    }

    document.querySelectorAll("#lang button").forEach(b => {
      b.addEventListener("click", () => {
        lang = b.dataset.lang;
        try { localStorage.setItem("lang", lang); } catch (e) {}
        applyLang();
      });
    });
    $("#search").addEventListener("input", renderServices);
    applyLang();
  </script>
</body>
</html>
