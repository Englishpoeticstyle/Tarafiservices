<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Studio - A Gift for Mohamed's Children</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2A7F7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learning Studio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF5EA;
    --card: #FFFDF8;
    --ink: #1F3B40;
    --teal: #2A7F7A;
    --terra: #E07A5F;
    --mustard: #F2C14E;
    --sky: #8FC7D6;
    --sage: #A8C5A0;
    --line: #E6DCCB;
    --muted: #6B7A7C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Cairo', system-ui, sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 14px 30px; }
  .ar { font-family: 'Noto Naskh Arabic', 'Cairo', serif; }

  /* Header */
  .hero {
    position: relative; overflow: hidden; background: var(--teal); color: #fff;
    border-radius: 30px; padding: 28px 26px 24px;
    box-shadow: 0 18px 34px -22px rgba(31,59,64,.7);
  }
  .ribbon {
    position: absolute; top: 18px; left: -44px; transform: rotate(-35deg);
    background: var(--mustard); color: var(--ink); font-weight: 900; padding: 6px 56px; font-size: .9rem;
  }
  .hero h1 { margin: 0 0 6px; font-size: clamp(1.9rem, 4.5vw, 2.6rem); font-weight: 900; }
  .dedication { margin: 0; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; opacity: .85; font-family: 'Cairo', sans-serif; }
  .honor { margin: 6px 0 18px; font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 900; line-height: 1.35; }
  .setup { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .setup .group { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font: inherit; font-weight: 700; font-size: .95rem; padding: 7px 14px;
    border-radius: 999px; cursor: pointer; border: 2px solid rgba(255,255,255,.7);
    background: transparent; color: #fff;
  }
  .pill[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
  .name-input {
    font: inherit; padding: 8px 14px; border-radius: 999px; border: none; min-width: 200px; color: var(--ink);
  }

  /* Languages and tabs */
  .langs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .lang-btn {
    font: inherit; font-weight: 800; font-size: 1rem; padding: 8px 16px; border-radius: 14px;
    cursor: pointer; border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .lang-btn[aria-pressed="true"] { background: var(--mustard); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tab {
    font: inherit; font-weight: 800; font-size: 1rem; padding: 9px 16px; border-radius: 14px;
    cursor: pointer; border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--terra); outline-offset: 3px; }

  /* Panel */
  .panel {
    background: var(--card); border-radius: 28px; padding: 24px 20px; min-height: 460px;
    box-shadow: 0 1px 0 rgba(31,59,64,.08), 0 16px 34px -22px rgba(31,59,64,.45);
  }
  .hint { margin: 0 0 14px; color: var(--muted); font-size: 1.1rem; text-align: center; }
  .bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat { font-weight: 800; background: var(--mustard); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 16px; }
  .center { display: flex; justify-content: center; margin-top: 16px; }
  .msg { min-height: 2em; text-align: center; font-weight: 800; font-size: 1.25rem; margin: 14px 0 0; }
  .msg.ok { color: var(--teal); }
  .msg.bad { color: var(--terra); }
  .btn {
    font: inherit; font-weight: 800; font-size: 1.05rem; padding: 10px 20px; border-radius: 14px;
    cursor: pointer; border: 2px solid var(--ink); background: var(--mustard); color: var(--ink);
    box-shadow: 0 4px 0 var(--ink);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  /* Speaker buttons */
  .spk {
    font: inherit; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--ink); background: var(--sky); font-size: 1.1rem;
    box-shadow: 0 3px 0 var(--ink); vertical-align: middle; margin-inline-start: 6px;
  }
  .spk:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

  /* Match cards */
  .mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 640px; margin: 0 auto; }
  .mcard {
    font: inherit; aspect-ratio: 3 / 4; padding: 6px; cursor: pointer; border-radius: 18px;
    border: 2px solid var(--ink); background: var(--teal); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .mcard .q { font-size: 2rem; opacity: .85; }
  .mcard.open { background: #fff; color: var(--ink); }
  .mcard.matched { background: var(--sage); }
  .mcard:disabled { cursor: default; }
  .cw { font-size: 1.35rem; font-weight: 900; direction: ltr; text-align: center; word-break: break-word; }
  .cp { font-size: .8rem; color: var(--muted); }
  .pic { font-size: 2.4rem; line-height: 1; }
  .cm { font-size: .9rem; font-weight: 800; }

  /* Builders */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 16px; }
  .picture { font-size: 4.8rem; line-height: 1; }
  .meaning { font-size: 1.3rem; font-weight: 800; text-align: center; }
  .pron { font-size: 1.1rem; color: var(--teal); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .tile {
    font: inherit; font-weight: 800; font-size: 1.8rem; color: var(--ink); min-width: 50px; height: 60px;
    padding: 0 10px; cursor: pointer; border: 2px solid var(--ink); border-radius: 14px;
    background: #fff; box-shadow: 0 4px 0 var(--ink);
  }
  .tile.word { height: auto; font-size: 1.3rem; padding: 10px 14px; }
  .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .tile:disabled { opacity: .22; cursor: default; box-shadow: none; }
  .slot { min-width: 50px; height: 60px; border-radius: 14px; border: 2px dashed #C9BFA9; background: #FBF8F1; }

  /* Math and quiz */
  .equation { font-size: clamp(2.4rem, 8vw, 3.6rem); font-weight: 900; text-align: center; margin: 10px 0 18px; direction: ltr; }
  .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 520px; margin: 0 auto; }
  .choice {
    font: inherit; font-size: 1.6rem; font-weight: 900; padding: 14px 10px; cursor: pointer;
    border: 2px solid var(--ink); border-radius: 16px; background: #fff; box-shadow: 0 4px 0 var(--ink);
  }
  .choice:disabled { opacity: .5; cursor: default; }
  .quiz-q { font-size: 1.5rem; font-weight: 900; text-align: center; margin: 10px 0 20px; }
  .quiz-c { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .quiz-c .choice { min-width: 140px; font-size: 1.2rem; }

  /* Drawing */
  .tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-bottom: 12px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink); }
  .swatch[aria-pressed="true"] { transform: scale(1.18); }
  .size-btn { font: inherit; font-weight: 800; padding: 6px 12px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; cursor: pointer; }
  .size-btn[aria-pressed="true"] { background: var(--sky); }
  #cv {
    display: block; width: 100%; max-width: 760px; height: auto; aspect-ratio: 760 / 440; margin: 0 auto;
    background: #fff; border-radius: 18px; border: 2px solid var(--ink); touch-action: none; cursor: crosshair;
  }
  .draw-prompt { font-size: 1.3rem; font-weight: 900; text-align: center; margin-bottom: 12px; }

  /* Story */
  .dice { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 640px; margin: 0 auto; }
  .die { background: #fff; border: 2px solid var(--line); border-bottom: 6px solid var(--sky); border-radius: 18px; padding: 14px; text-align: center; }
  .die small { display: block; color: var(--muted); font-weight: 800; margin-bottom: 4px; }
  .die b { font-size: 1.3rem; }

  /* Listen list */
  .lrow {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-bottom: 10px;
  }
  .lrow .w { font-size: 1.4rem; font-weight: 900; direction: ltr; }
  .lrow .p { color: var(--teal); font-weight: 700; }
  .lrow .m { color: var(--muted); font-weight: 700; }
  .lsec { font-size: 1.2rem; font-weight: 900; margin: 18px 0 10px; }

  /* Prayer */
  .sub { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .grid-pray { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .pcard {
    background: #fff; border: 2px solid var(--line); border-bottom: 6px solid var(--sage);
    border-radius: 18px; padding: 14px; text-align: center;
  }
  .pcard .emo { font-size: 2.4rem; }
  .pcard h3 { margin: 6px 0 2px; font-size: 1.4rem; font-weight: 900; }
  .pcard .sm { color: var(--muted); font-weight: 700; font-size: .95rem; }
  .pcard .rak { color: var(--teal); font-weight: 900; margin-top: 6px; }
  .info {
    background: #FBF8F1; border: 2px dashed var(--line); border-radius: 18px;
    padding: 16px 20px; margin-top: 18px; line-height: 2; font-size: 1.1rem; font-weight: 700;
  }
  .info h3 { margin: 0 0 6px; font-size: 1.3rem; font-weight: 900; color: var(--teal); }
  .steps-list { padding-inline-start: 24px; margin: 0; }
  .steps-list li { margin-bottom: 4px; }

  footer { margin-top: 22px; text-align: center; color: var(--muted); font-weight: 700; }

  @media (max-width: 560px) {
    .mgrid { grid-template-columns: repeat(3, 1fr); }
    .choices { grid-template-columns: repeat(2, 1fr); }
    .dice { grid-template-columns: 1fr; }
    .panel { padding: 16px 12px; }
    .ribbon { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

  const HEROES = ["🧒 بطل شجاع","👸 أميرة","🦸 بطل خارق","🧑‍🚀 رائد فضاء","🧙 ساحر صغير","🤴 أمير"];

  const THINGS = ["🗝️ مفتاح سحري","🪄 عصا مضيئة","📦 صندوق غامض","🐉 تنين صغير","🧭 بوصلة ذهبية","🎈 بالون طائر"];
  const ACTS = ["وجد كنزاً مخفياً","صنع صديقاً جديداً","رسم خريطة للمغامرة","حلّ لغزاً صعباً","طار عالياً فوق المدينة","اخترع شيئاً عجيباً"];
  const PALETTE = ["#1F3B40","#E07A5F","#F2C14E","#2A7F7A","#8FC7D6","#A8C5A0","#9B5DE5","#FFFFFF"];
  const VOICE = { en: "en-US", fr: "fr-FR", es: "es-ES", de: "de-DE", tr: "tr-TR", ru: "ru-RU", ar: "ar-SA", it: "it-IT" };

  // ============ STATE ============
  let T = 6;
  let level = "primary";
  let kid = "boy";
  let kidName = "";
  let mode = "match";
  let pSub = "five";
  let game = null;

  const $ = id => document.getElementById(id);
  const rand = n => Math.floor(Math.random() * n);
  const L = () => LANGS[T];
  const isArabic = () => L().code === "ar";

  // ============ SOUND ============
  // Uses the device's built-in voices. Clear, slow speech suited to children.
  function speak(text, code) {
    if (!("speechSynthesis" in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = VOICE[code] || "en-US";
    u.lang = lang;
    u.rate = 0.75;
    u.pitch = 1;
    const v = speechSynthesis.getVoices().find(x => x.lang.toLowerCase().startsWith(lang.slice(0, 2)));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  const speakAr = text => speak(text, "ar");

  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = rand(i + 1);
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }
  function scrambledOrder(n) {
    let o;
    do { o = shuffle([...Array(n).keys()]); } while (n > 1 && o.every((v, i) => v === i));
    return o;
  }
  function praise() {
    const n = kidName.trim() ? " " + kidName.trim() : "";
    return kid === "girl" ? `برافو يا أميرتي${n}! 🌟` : `برافو يا بطل${n}! 🌟`;
  }
  function wordsPool() {
    return L().words.slice(0, level === "primary" ? 6 : 10);
  }

  // ============ MATCH ============
  function newMatch() {
    const pool = wordsPool();
    const n = Math.min(pool.length, level === "primary" ? 6 : 8);
    const picked = shuffle(pool).slice(0, n);
    const cards = shuffle(picked.flatMap((w, k) => [{ k, face: "w" }, { k, face: "p" }]));
    game = { items: picked, cards, open: [], matched: [], moves: 0 };
  }
  function flip(i) {
    const g = game;
    const c = g.cards[i];
    if (g.open.length === 2 || g.open.includes(i) || g.matched.includes(c.k)) return;
    g.open.push(i);
    if (c.face === "w") speak(g.items[c.k][0], L().code);
    if (g.open.length === 2) {
      g.moves++;
      const [a, b] = g.open;
      if (g.cards[a].k === g.cards[b].k && g.cards[a].face !== g.cards[b].face) {
        g.matched.push(g.cards[a].k);
        g.open = [];
      } else {
        render();
        setTimeout(() => { if (game === g) { g.open = []; render(); } }, 900);
        return;
      }
    }
    render();
  }

  // ============ BUILDERS (spell, sentence, prayer steps) ============
  function makeBuild(kind, tokens, text, meaning, pron, sep) {
    return { kind, sep, tokens, order: scrambledOrder(tokens.length), answer: [], status: "", text, meaning, pron };
  }
  function newSpell() {
    const pool = wordsPool();
    const w = pool[rand(pool.length)];
    game = makeBuild("spell", [...w[0]], w[0], w[2], w[1], "");
  }
  function newSent() {
    const s = L().sent[rand(L().sent.length)];
    game = makeBuild("sent", s[0].split(" "), s[0], s[1], "", " ");
  }
  function newPray() {
    const steps = level === "primary" ? PRAY_STEPS.slice(0, 6) : PRAY_STEPS;
    game = makeBuild("pray", steps.map(s => s.label), "", "", "", " ");
    game.steps = steps;
  }
  function isCorrect(g) {
    if (g.kind === "pray") return g.answer.every((p, k) => p === k);
    return g.answer.map(q => g.tokens[q]).join(g.sep) === g.tokens.join(g.sep);
  }
  function pick(p) {
    const g = game;
    if (g.status === "ok" || g.answer.includes(p)) return;
    g.answer.push(p);
    if (g.answer.length === g.tokens.length) {
      if (isCorrect(g)) {
        g.status = "ok";
        score++;
        if (g.kind === "spell" || g.kind === "sent") speak(g.text, L().code);
        if (g.kind === "pray") speakAr("صلاتك تبدأ بالنية ثم تكبيرة الإحرام");
      } else {
        g.status = "bad";
        render();
        setTimeout(() => { if (game === g) { g.answer = []; g.status = ""; render(); } }, 900);
        return;
      }
    }
    render();
  }
  function unpick(k) {
    if (game.status === "ok") return;
    game.answer.splice(k, 1);
    game.status = "";
    render();
  }

  // ============ QUIZ ============
  function newQuiz() {
    game = { kind: "quiz", q: QUIZ[rand(QUIZ.length)], status: "", picked: -1 };
  }
  function answerQuiz(i) {
    if (game.status === "ok") return;
    game.picked = i;
    if (i === game.q.a) { game.status = "ok"; score++; }
    else game.status = "bad";
    render();
  }

  // ============ MATH ============
  function newMath() {
    let a, b, op, ans;
    if (level === "primary") {
      a = 1 + rand(9); b = 1 + rand(10 - a); op = "+"; ans = a + b;
    } else {
      const r = Math.random();
      if (r < 0.35) { op = "+"; a = 10 + rand(60); b = 10 + rand(40); ans = a + b; }
      else if (r < 0.7) { op = "−"; a = 10 + rand(90); b = 1 + rand(a - 1); ans = a - b; }
      else { op = "×"; a = 2 + rand(11); b = 2 + rand(11); ans = a * b; }
    }
    const set = new Set([ans]);
    while (set.size < 4) {
      const d = ans + (rand(9) - 4);
      if (d >= 0 && d !== ans) set.add(d);
    }
    game = { a, b, op, ans, choices: shuffle([...set]), status: "" };
  }
  function answerMath(v) {
    if (game.status === "ok") return;
    if (v === game.ans) {
      game.status = "ok";
      score++;
      if (v >= 1 && v <= 10) speak(L().nums[v - 1], L().code);
    } else game.status = "bad";
    render();
  }

  // ============ DRAW ============
  function newDrawWord() {
    const pool = L().words;
    game = { drawWord: pool[rand(pool.length)] };
  }
  function initCanvas() {
    const c = $("cv");
    if (!c) return;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, c.width, c.height);
    let drawing = false;
    const pos = e => {
      const r = c.getBoundingClientRect();
      return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height];
    };
    c.addEventListener("pointerdown", e => {
      drawing = true;
      c.setPointerCapture(e.pointerId);
      const [x, y] = pos(e);
      ctx.strokeStyle = brush.color;
      ctx.lineWidth = brush.size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(x, y);
    });
    c.addEventListener("pointermove", e => {
      if (!drawing) return;
      const [x, y] = pos(e);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    });
    const stop = () => { drawing = false; };
    c.addEventListener("pointerup", stop);
    c.addEventListener("pointercancel", stop);
  }
  function clearCanvas() {
    const c = $("cv");
    if (!c) return;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, c.width, c.height);
  }
  function saveDrawing() {
    const c = $("cv");
    if (!c) return;
    const a = document.createElement("a");

    a.click();

  // ============ STORY ============
  function rollStory() {

  // ============ VIEWS ============
  function viewMatch() {
    const g = game;
    const done = g.matched.length === g.items.length;
    const cards = g.cards.map((c, i) => {
      const it = g.items[c.k];
      const isMatched = g.matched.includes(c.k);
      const up = g.open.includes(i) || isMatched;
      const cls = ["mcard", up ? "open" : "", isMatched ? "matched" : ""].join(" ");
      let face;
      if (!up) face = `<span class="q">✦</span>`;
      else if (c.face === "w") face = `<span class="cw ${isArabic() ? "ar" : ""}">${it[0]}</span>${it[1] ? `<span class="cp">${it[1]}</span>` : ""}`;
      else face = `<span class="pic">${it[3]}</span><span class="cm">${it[2]}</span>`;
      return `<button class="${cls}" data-act="flip" data-idx="${i}" ${isMatched ? "disabled" : ""}>${face}</button>`;
    }).join("");
    return `
      <p class="hint">${UI.matchHint}</p>
      <div class="bar"><span class="stat">${UI.moves}: ${g.moves}</span></div>
      <div class="mgrid" dir="${L().dir}">${cards}</div>
      ${done ? `<p class="msg ok">${UI.done}</p><div class="center"><button class="btn" data-act="again">${UI.again}</button></div>` : ""}`;
  }

  function viewBuild() {
    const g = game;
    const isSpell = g.kind === "spell";
    const isSent = g.kind === "sent";
    const isPray = g.kind === "pray";
    const tile = isSpell ? "tile" : "tile word";
    const dir = isPray ? "rtl" : L().dir;
    const ar = (isArabic() || isPray) ? "ar" : "";
    const slots = g.tokens.map((_, k) =>
      k < g.answer.length
        ? `<button class="${tile} ${ar}" data-act="unpick" data-idx="${k}">${g.tokens[g.answer[k]]}</button>`
        : `<span class="slot"></span>`
    ).join("");
    const pool = g.order.map(p => {
      const used = g.answer.includes(p);
      return `<button class="${tile} ${ar}" data-act="pick" data-idx="${p}" ${used ? "disabled" : ""}>${g.tokens[p]}</button>`;
    }).join("");
    const revealed = g.status === "ok";

    let picture = "";
    let stage = "";
    let reveal = "";
    if (isSpell) {
      picture = `<div class="picture">${pictureFor(g)}</div>`;
      stage = `<div class="meaning">${g.meaning}</div>`;
      if (revealed) reveal = `<div class="meaning ${ar}" dir="${L().dir}">${g.text}<button class="spk" data-act="speakcur">🔊</button></div>`;
    } else if (isSent) {
      stage = `<div class="meaning">${g.meaning}</div>`;
      if (revealed) reveal = `<div class="meaning ${ar}" dir="${L().dir}">${g.text}<button class="spk" data-act="speakcur">🔊</button></div>`;
    } else {
      picture = `<div class="picture">🕌</div>`;
      if (revealed) {
        reveal = `<ol class="steps-list" style="text-align:right">${g.steps.map((s, k) =>
          `<li>${s.label} <button class="spk" data-act="speakstep" data-idx="${k}">🔊</button></li>`).join("")}</ol>`;
      }
    }
    const hint = isSpell ? UI.spellHint : isSent ? UI.sentHint : UI.prayHint;
    const msg = revealed ? `<p class="msg ok">${UI.correct}</p>`
              : g.status === "bad" ? `<p class="msg bad">${UI.wrong}</p>` : `<p class="msg"></p>`;
    const next = revealed && !isPray ? `<div class="center"><button class="btn" data-act="next">${UI.next}</button></div>` : "";
    const restart = revealed && isPray ? `<div class="center"><button class="btn" data-act="prayagain">${UI.next}</button></div>` : "";
    return `
      <p class="hint">${hint}</p>
      <div class="bar"><span class="stat">⭐ ${score}</span></div>
      <div class="stage">${picture}${stage}${reveal}</div>
      <div class="row" dir="${dir}">${slots}</div>
      <div class="row" dir="${dir}">${pool}</div>
      ${msg}${next}${restart}`;
  }
  function pictureFor(g) {
    const w = L().words.find(x => x[0] === g.text);
    return w ? w[3] : "";
  }

  function viewQuiz() {
    const g = game;
    const choices = g.q.c.map((c, i) => {
      let style = "";
      if (g.status === "ok" && i === g.q.a) style = "background:#E9FBEA;";
      if (g.status === "bad" && i === g.picked) style = "background:#FBE3DC;";
      return `<button class="choice" style="${style}" data-act="quiz" data-idx="${i}" ${g.status === "ok" ? "disabled" : ""}>${c}</button>`;
    }).join("");
    const msg = g.status === "ok" ? `<p class="msg ok">${UI.correct}</p>`
              : g.status === "bad" ? `<p class="msg bad">${UI.wrong}</p>` : `<p class="msg"></p>`;
    const next = g.status === "ok" ? `<div class="center"><button class="btn" data-act="nextquiz">${UI.next}</button></div>` : "";
    return `
      <p class="hint">أجب عن السؤال</p>
      <div class="bar"><span class="stat">⭐ ${score}</span></div>
      <div class="quiz-q ar">${g.q.q}</div>
      <div class="quiz-c">${choices}</div>
      ${msg}${next}`;
  }

  function viewMath() {
    const g = game;
    const word = g.ans >= 1 && g.ans <= 10 ? L().nums[g.ans - 1] : "";
    const pronN = g.ans >= 1 && g.ans <= 10 ? L().numsP[g.ans - 1] : "";
    const choices = g.choices.map(v =>
      `<button class="choice" data-act="ans" data-idx="${v}" ${g.status === "ok" ? "disabled" : ""}>${v}</button>`
    ).join("");
    let msg = `<p class="msg"></p>`;
    let next = "";
    if (g.status === "ok") {
      msg = `<p class="msg ok">${praise()}</p>`;
      next = `<div class="center"><button class="btn" data-act="nextmath">${UI.next}</button></div>`;
    } else if (g.status === "bad") msg = `<p class="msg bad">${UI.wrong}</p>`;
    const numLine = g.status === "ok" && word
      ? `<div class="meaning" dir="${L().dir}">${g.ans} = ${word}${pronN ? ` <span class="pron">(${pronN})</span>` : ""}</div>`
      : "";
    return `
      <p class="hint">${UI.mathHint}</p>
      <div class="bar"><span class="stat">⭐ ${score}</span></div>
      <div class="equation">${g.a} ${g.op} ${g.b} = ?</div>
      <div class="choices">${choices}</div>
      ${numLine}${msg}${next}`;
  }

  function viewDraw() {

    const swatches = PALETTE.map((c, i) =>

    ).join("");

    ).join("");
    return `
      <p class="hint">${UI.drawHint}</p>

      </div>`;
  }
  function promptText(w) {
    return `${w[3]} ${w[2]}${isArabic() ? "" : " ← " + w[0]}`;
  }

  function viewStory() {
    const g = game;
    const card = (label, val) => `<div class="die"><small>${label}</small><b>${val}</b></div>`;
    return `
      <p class="hint">${UI.storyHint}</p>
      <div class="dice">
        ${card(UI.hero, g.hero)}${card(UI.place, g.place)}${card(UI.thing, g.thing)}${card(UI.act, g.act)}
      </div>
      <p class="msg ok" style="margin-top:20px">${UI.story}</p>
      <div class="center"><button class="btn" data-act="roll">${UI.roll}</button></div>`;
  }

  function viewListen() {
    const L_ = L();
    const words = L_.words.map((w, i) => `
      <div class="lrow">
        <div>
          <div class="w ${isArabic() ? "ar" : ""}">${w[0]}</div>
          ${w[1] ? `<div class="p">${w[1]}</div>` : ""}
          <div class="m">${w[3]} ${w[2]}</div>
        </div>
        <button class="spk" data-act="speakword" data-idx="${i}" aria-label="استمع">🔊</button>
      </div>`).join("");
    const sents = L_.sent.map((s, i) => `
      <div class="lrow">
        <div>
          <div class="w ${isArabic() ? "ar" : ""}">${s[0]}</div>
          <div class="m">${s[1]}</div>
        </div>
        <button class="spk" data-act="speaksent" data-idx="${i}" aria-label="استمع">🔊</button>
      </div>`).join("");
    return `
      <p class="hint">${UI.listenHint}</p>
      <div class="lsec">الكلمات</div>${words}
      <div class="lsec">الجمل</div>${sents}`;
  }

  function viewPray() {
    const subs = `<div class="sub">${UI.praySubs.map(([k, label]) =>
      `<button class="tab" data-psub="${k}" aria-selected="${pSub === k}" style="${pSub === k ? "background:var(--ink);color:#fff" : ""}">${label}</button>`).join("")}</div>`;
    if (pSub === "steps") return `${subs}${viewBuild()}`;
    if (pSub === "quiz") return `${subs}${viewQuiz()}`;
    const prayers = PRAYERS.map((p, i) => `
      <div class="pcard">
        <div class="emo">${p.emoji}</div>
        <h3 class="ar">${p.name} <button class="spk" data-act="speakname" data-idx="${i}">🔊</button></h3>
        <div class="sm">${p.tr}</div>
        <div class="sm">${p.time}</div>
        <div class="rak">${p.rak} ${UI.rak} ${UI.fardh}</div>
      </div>`).join("");
    const rules = `<ul class="steps-list">${UI.rules.map(r => `<li>${r}</li>`).join("")}</ul>`;
    return `
      ${subs}
      <p class="hint">${UI.fiveTitle}</p>
      <div class="grid-pray">${prayers}</div>
      <div class="info"><h3>${UI.rulesTitle}</h3>${rules}</div>
      <div class="info"><h3>${UI.finishTitle}</h3>${UI.finishText}
        <div><button class="spk" data-act="speakfinish" aria-label="استمع">🔊</button></div>
      </div>`;
  }

  const VIEWS = { match: viewMatch, spell: viewBuild, sent: viewBuild, math: viewMath,
                  draw: viewDraw, story: viewStory, listen: viewListen, pray: viewPray };

  // ============ RENDER AND CONTROL ============
  function chrome() {
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.lang) === T)));
    document.querySelectorAll("[data-level]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.level === level)));
    document.querySelectorAll("[data-kid]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kid === kid)));
    document.querySelectorAll(".tabs [data-mode]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === mode)));
  }

  function render() {
    chrome();
    $("panel").innerHTML = VIEWS[mode]();
    if (mode === "draw") initCanvas();
  }

  function startGame(m) {
    if (m === "match") newMatch();
    if (m === "spell") newSpell();
    if (m === "sent") newSent();
    if (m === "math") newMath();
    if (m === "draw") newDrawWord();
    if (m === "story") rollStory();
    if (m === "pray") {
      if (pSub === "steps") newPray();
      if (pSub === "quiz") newQuiz();
    }
  }

  function setMode(m) {
    mode = m;
    if (m === "pray") pSub = "five";
    startGame(m);
    render();
  }

  function buildStatic() {
    $("levels").innerHTML = UI.levels.map(([k, label]) => `<button class="pill" data-level="${k}">${label}</button>`).join("");
    $("kids").innerHTML = UI.kids.map(([k, label]) => `<button class="pill" data-kid="${k}">${label}</button>`).join("");
    $("langs").innerHTML = LANGS.map((l, i) => `<button class="lang-btn" data-lang="${i}">${l.name}</button>`).join("");
    $("tabs").innerHTML = UI.tabs.map(([k, label]) => `<button class="tab" role="tab" data-mode="${k}">${label}</button>`).join("");
  }

  // ============ EVENTS ============
  document.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t || t.disabled) return;
    const d = t.dataset;
    if (d.lang !== undefined) { T = Number(d.lang); startGame(mode); render(); return; }
    if (d.level !== undefined) { level = d.level; startGame(mode); render(); return; }
    if (d.kid !== undefined) { kid = d.kid; render(); return; }
    if (d.mode !== undefined) { setMode(d.mode); return; }
    if (d.psub !== undefined) {
      pSub = d.psub;
      startGame("pray");
      render();
      return;
    }
    if (d.act === undefined) return;
    const idx = Number(d.idx);
    switch (d.act) {
      case "flip": flip(idx); break;
      case "pick": pick(idx); break;
      case "unpick": unpick(idx); break;
      case "next": startGame(game.kind); render(); break;
      case "prayagain": newPray(); render(); break;
      case "again": newMatch(); render(); break;
      case "ans": answerMath(idx); break;
      case "nextmath": newMath(); render(); break;
      case "quiz": answerQuiz(idx); break;
      case "nextquiz": newQuiz(); render(); break;
      case "speakcur": speak(game.text, L().code); break;
      case "speakstep": speakAr(game.steps[idx].say); break;
      case "speakword": speak(L().words[idx][0], L().code); break;
      case "speaksent": speak(L().sent[idx][0], L().code); break;
      case "speakname": speakAr(PRAYERS[idx].name); break;
      case "speakfinish": speakAr(UI.finishText); break;
      case "color":
        brush.color = PALETTE[idx];
        document.querySelectorAll(".swatch").forEach((s, i) => s.setAttribute("aria-pressed", String(i === idx)));
        break;
      case "size":
        brush.size = idx;
        document.querySelectorAll(".size-btn").forEach(s => s.setAttribute("aria-pressed", String(Number(s.dataset.idx) === idx)));
        break;
      case "clear": clearCanvas(); break;
      case "save": saveDrawing(); break;
      case "newdraw":
        newDrawWord();
        $("drawPrompt").textContent = promptText(game.drawWord);
        break;
      case "roll": rollStory(); render(); break;
    }
  });

  $("kidName").addEventListener("input", e => { kidName = e.target.value; });

  buildStatic();
  setMode("match");
</script>
<script>
  // Save the studio on this device so it works offline after the first online visit.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Offline mode not available:", err));
    });
  }
</script>
</body>
</html>
